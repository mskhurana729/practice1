<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easing Functions</title>
  </head>
  <link rel="stylesheet" href="./style.css" />
  <script src="./index.js" defer></script>
  <body>
    <div class=""><div class=""></div></div>

    <ul>
      <li><button class="animation-button">Start animation</button></li>
      <li>
        <label for="easing-select">Choose an easing function:</label>
        <select name="" id="easing-select">
          <option value="" selected>linear</option>
          <option>linear(0, 0.5 50%, 1)</option>
          <option>ease</option>
          <option>ease-in</option>
          <option>ease-in-out</option>
          <option>ease-out</option>
          <option>cubic-bezier(0.1, -0.6, 0.2, 0)</option>
          <option>cubic-bezier(0, 1.1, 0.8, 4)</option>
          <option>steps(5, end)</option>
          <option>steps(3, start)</option>
          <option>steps(4)</option>
        </select>
      </li>
    </ul>
  </body>
</html>
